<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>한결 | 게시판</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="site-header"></div>

  <main class="page">
    <div id="list-view">
      <div class="page-head">
        <div>
          <h1 style="font-size: 32px;">게시판</h1>
          <p class="lead">한결 소식을 남기고 서로 이야기를 나눕니다.</p>
        </div>
        <a class="btn btn-small" href="write.html">새 글 작성</a>
      </div>
      <div id="notice" class="notice hidden"></div>
      <div id="post-list" class="post-list"></div>
    </div>

    <div id="detail-view" class="hidden">
      <div class="page-head">
        <div>
          <h1 id="post-title" style="font-size: 32px;">게시글</h1>
          <p class="post-meta" id="post-meta"></p>
        </div>
        <a class="btn-ghost" href="board.html">목록으로</a>
      </div>
      <article class="card">
        <div class="post-body" id="post-content"></div>
      </article>
      <section id="replies" class="replies hidden"></section>
    </div>
  </main>

  <footer>
    © 2026 한결. All rights reserved.
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
  <script src="js/board.js"></script>
</body>
</html>
