<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>한결 | 새 글 작성</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="site-header"></div>

  <main class="page">
    <div class="page-head">
      <div>
        <h1 style="font-size: 32px;">새 글 작성</h1>
        <p class="lead">제목과 내용을 입력한 뒤 등록해 주세요.</p>
      </div>
      <a class="btn-ghost" href="board.html">목록으로</a>
    </div>

    <div id="notice" class="notice hidden"></div>

    <form id="write-form" class="form-wide card">
      <label>
        제목
        <input type="text" id="post-title" maxlength="80" required>
      </label>
      <label>
        내용
        <textarea id="post-content" rows="10" required></textarea>
      </label>
      <button type="submit">등록하기</button>
    </form>
  </main>

  <footer>
    © 2026 한결. All rights reserved.
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
  <script src="js/write.js"></script>
</body>
</html>
